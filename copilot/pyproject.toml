[project]
name = "nps-copilot"
version = "0.5.0"
description = "NPS Guide Copilot: LLM intake and explanation on top of the deterministic NPS Guide trip engine (CSYE 7374 LLMOps)"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
# 讲解版的本机配音（可选）；misaki 0.9 写着要 Python 3.12 以下，3.13 上装要加 --ignore-requires-python
# 一轮对话按 LangGraph 的流程图跑、对话存档（可选）
graph = ["langgraph>=1.0", "langgraph-checkpoint-sqlite>=2.0"]
# 回答问题时按意思找资料：向量存在 Neon 的 Postgres 里（pgvector），psycopg 连数据库（可选，Modal 上装）
rag = ["psycopg[binary]>=3.2"]
# 评测记到 MLflow、向量检索对照实验（可选，只在本机跑）
experiments = ["mlflow>=3.0", "chromadb>=1.0"]
tts = ["kokoro-onnx>=0.6", "onnxruntime>=1.20", "misaki[zh]>=0.9.4", "soundfile>=0.13"]
dev = ["pytest>=8", "jsonschema>=4.21", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["nps_copilot"]

[tool.setuptools.package-data]
nps_copilot = ["prompts/*.txt", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Python 代码检查（CI 里跑 ruff check copilot）：语法错误、没定义的名字、没用到的变量和 import、
# 循环里的闭包、字符串里混进控制字符这类真 bug；风格类的不管（中文注释多，行长不限）
[tool.ruff]
target-version = "py311"
line-length = 160

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "PLE"]
ignore = [
  "E731",  # 用 lambda 赋值：小工具函数里常用
  "B008",  # 参数默认值里调用函数（FastAPI 的写法）
  "B905",  # zip 不写 strict：这里的几处长度本来就一样
]
