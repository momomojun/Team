# 连 Ollama 一起启动：电脑上不用另外装 Ollama、下模型。和 docker-compose.yml 一起用：
#   docker compose -f copilot/docker-compose.yml -f copilot/docker-compose.ollama.yml up -d --build
# 有 NVIDIA 显卡再加一个 -f copilot/docker-compose.gpu.yml（快很多；没显卡也能跑，一句话要几十秒）。
# 第一次会下载 Ollama 镜像（约 3.8 GB）和模型 qwen3.5:4b-q4_K_M（约 3.4 GB），模型存在 ollama-models 卷里，以后不再下载。
# 已经在本机下好模型的，可以设 OLLAMA_MODELS=<本机的 models 目录> 直接用，不再下载。
services:
  ollama:
    # 和 experiments/local-model-validation 里本机用的 Ollama 同一个版本
    image: ollama/ollama:0.40.5
    environment:
      OLLAMA_CONTEXT_LENGTH: "4096"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: 10m
      OLLAMA_NO_CLOUD: "1"
    volumes:
      - ${OLLAMA_MODELS:-ollama-models}:/root/.ollama/models
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # 只跑一次：模型没下过就下载，下过了几秒就结束
  ollama-pull:
    image: ollama/ollama:0.40.5
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["ollama", "pull", "${COPILOT_MODEL:-qwen3.5:4b-q4_K_M}"]
    restart: "no"

  copilot:
    environment:
      OLLAMA_HOST_URL: http://ollama:11434
    depends_on:
      ollama-pull:
        condition: service_completed_successfully

volumes:
  ollama-models:
