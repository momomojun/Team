# 每天读一次 NPS 公告（计划书的 fast-changing data）：抓所有公园的公告快照，以前没报过的关闭公告开一个 issue（标签 nps-alerts）。
# 仓库设置里有模型的 secret（OPENROUTER_API_KEY、OPENAI_API_KEY、GEMINI_API_KEY）时，用模型读公告提取关闭，只读新出现、
# 改过的几条（读过的记在 actions/cache 里）；一把都没有就只用规则。关闭清单（closures-latest.json）和快照一起存成 artifact。
# 新的关闭公告是模型没见过的数据，可以标好答案做下一版提示词的评测。
# 仓库设置里加了 secret DATA_GOV_API_KEY 就用它（DEMO_KEY 按 IP 限次数，GitHub 的机器是很多仓库共用的，常常 429）。
name: NPS alerts (nightly)

on:
  schedule:
    # 加州时间每天 0 点（仓库主人 10-19 定的）。GitHub 的定时只认 UTC，加州夏令时是 UTC-7、冬令时是 UTC-8，
    # 所以 UTC 7 点、8 点各触发一次，下面的 when 让每个加州日子第一次触发的那次往下跑
    - cron: "0 7 * * *"
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: read  # when 要查今天是不是已经跑过

concurrency:
  group: alerts-nightly
  cancel-in-progress: false

jobs:
  when:
    name: First run of the California day?
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        # 手动触发的照跑。定时触发的：这个加州日子里还没有别的定时那次跑过读公告，才往下跑。
        # 以前只认“加州正好 0 点那一小时”，10-20 GitHub 的定时晚了一个多小时，两次都会被跳过；现在晚多久都会跑、每天只跑一次。
        # 冬令时 UTC 7 点那次是加州前一天 23 点，前一天已经跑过就跳过（20 点以后触发的都不跑，留给 0 点那次）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "加州现在 $(TZ=America/Los_Angeles date '+%F %H:%M')"
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          hour=$(TZ=America/Los_Angeles date +%-H)
          if [ "$hour" -ge 20 ]; then echo "加州 ${hour} 点，留给 0 点那次"; echo "run=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          since=$(date -u -d "@$(TZ=America/Los_Angeles date -d 00:00 +%s)" +%FT%TZ)
          done=0
          for id in $(gh api "repos/${{ github.repository }}/actions/workflows/alerts-nightly.yml/runs?event=schedule&created=>=${since}&per_page=20"                         --jq ".workflow_runs[] | select(.id != ${{ github.run_id }}) | .id"); do
            ran=$(gh api "repos/${{ github.repository }}/actions/runs/${id}/jobs" --jq '[.jobs[] | select(.name | startswith("Fetch NPS alerts")) | select(.conclusion == "success" or .status != "completed")] | length')
            if [ "${ran:-0}" -gt 0 ]; then done=1; echo "今天已经跑过（run ${id}）"; fi
          done
          if [ "$done" = 1 ]; then echo "run=false" >> "$GITHUB_OUTPUT"; else echo "run=true" >> "$GITHUB_OUTPUT"; fi

  alerts:
    name: Fetch NPS alerts, report new closures
    needs: when
    if: needs.when.outputs.run == 'true'
    runs-on: ubuntu-latest
    env:
      # 快照日期、issue 标题的日期都按加州的日子
      TZ: America/Los_Angeles
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci || npm install --no-audit --no-fund
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch alerts snapshot
        env:
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
        run: npm run alerts:fetch
      # 读过的公告（按 id + 更新时间 + 提示词版本）：每晚接着上一晚的用，只把新的、改过的交给模型
      - uses: actions/cache@v4
        with:
          path: copilot/data/alerts/extracted.json
          key: alerts-extracted-${{ github.run_id }}
          restore-keys: alerts-extracted-
      - name: Read alerts with the model (only new or changed ones)
        id: extract
        continue-on-error: true
        # 模型按 providers.alerts_chain 的顺序：MiniMax（OpenRouter 免费，推理开 high）→ GPT-4.1 mini → Gemini，
        # 前一个出错（额度用完、服务忙）换下一个；一把 key 都没有就只用规则（CI 上没有本机模型）
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY$OPENAI_API_KEY$GEMINI_API_KEY" ]; then export COPILOT_ALERTS_PROVIDER=rules; fi
          cd copilot && python -m nps_copilot alerts --snapshot data/alerts/latest.json | tee ../extract.log
      - uses: actions/upload-artifact@v4
        with:
          name: nps-alerts-snapshot
          path: |
            copilot/data/alerts/latest.json
            copilot/data/alerts/closures-latest.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Find closure alerts not reported before
        id: report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create nps-alerts --color a04c2e --description "每晚读 NPS 公告发现的新关闭" 2>/dev/null || true
          gh issue list --label nps-alerts --state all --limit 500 --json body --jq '.[].body' > known.txt
          python copilot/scripts/alerts_report.py copilot/data/alerts/latest.json --known known.txt --closures copilot/data/alerts/closures-latest.json --out report.md | tee report.log
          grep -m1 '^NEW=' report.log >> "$GITHUB_OUTPUT"
      - name: Open an issue
        if: steps.report.outputs.NEW != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --label nps-alerts --title "NPS 公告：${{ steps.report.outputs.NEW }} 条新的关闭（$(date +%F)）/ New NPS closure alerts" --body-file report.md
