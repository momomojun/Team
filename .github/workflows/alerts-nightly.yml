# 每天读一次 NPS 公告（计划书的 fast-changing data）：抓所有公园的公告快照，以前没报过的关闭公告记进同一个一直开着的 issue（标签 nps-alerts）。
# 11-20 起不再每晚开一个新 issue、一个新分支（一个多月堆了 26 个 issue、22 个分支没人看）：只有一个 issue（正文里有 <!-- nps-alerts-rolling -->），
# 每晚改正文（现在还要不要改 closures.ts）、有新公告时在下面加一条评论；提议只推到一个 bot/closures 分支、每晚覆盖；每周集中处理一次。
# 仓库设置里有模型的 secret（OPENROUTER_API_KEY、GEMINI_API_KEY、GROQ_API_KEY、DEEPSEEK_API_KEY）时，用模型读公告提取关闭，只读新出现、
# 改过的几条（读过的记在 actions/cache 里）；一把都没有就只用规则。关闭清单（closures-latest.json）和快照一起存成 artifact。
# 新的关闭公告是模型没见过的数据，可以标好答案做下一版提示词的评测。
# 10-20 补上闭环（仓库主人定的“模型提议、人来批”）：
#   1. 抽查：读完再让同一串模型读 26 条标好答案的旧公告，分数掉到门槛以下就开 alerts-quality issue（模型换了、NPS 改了写法都能发现）；
#      每周一（加州）跑一次、手动触发也跑，多约 26 次调用（10-26 仓库主人定的：OpenRouter 免费档一天约 50 次，每晚抽查会挤掉读新公告的额度）；
#      仓库变量 ALERTS_CANARY 设成 0 就不抽查
#   2. 提议：今天还有效、模型和规则都认、closures.ts 里还没有的关闭写进 closures.ts，推到 bot/closures 分支（每晚覆盖），issue 里给开 PR 的链接；
#      GitHub 不让工作流自己开 PR（仓库设置里没开），而且机器人开的 PR 不会跑 CI，所以由人点链接开 PR
#   3. 发布：当晚的关闭清单推到 data/alerts-live 分支，网站行程页按它排两周内出发的行程（src/lib/alerts-live.ts）；
#      当晚调用模型的计费总账并进同一个分支的 usage.json，后台看（copilot/scripts/publish_usage.py）
# 仓库设置里加了 secret DATA_GOV_API_KEY 就用它（DEMO_KEY 按 IP 限次数，GitHub 的机器是很多仓库共用的，常常 429）。
name: NPS alerts (nightly)

on:
  schedule:
    # 加州时间每天 0 点（仓库主人 10-19 定的）。GitHub 的定时只认 UTC，加州夏令时是 UTC-7、冬令时是 UTC-8，
    # 所以 UTC 7 点、8 点各触发一次，下面的 when 让每个加州日子第一次触发的那次往下跑
    - cron: "0 7 * * *"
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write  # 推 bot/closures-* 和 data/alerts-live 分支
  issues: write
  actions: read  # when 要查今天是不是已经跑过

concurrency:
  group: alerts-nightly
  cancel-in-progress: false

jobs:
  when:
    name: First run of the California day?
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        # 手动触发的照跑。定时触发的：这个加州日子里还没有别的定时那次跑过读公告，才往下跑。
        # 以前只认“加州正好 0 点那一小时”，10-20 GitHub 的定时晚了一个多小时，两次都会被跳过；现在晚多久都会跑、每天只跑一次。
        # 冬令时 UTC 7 点那次是加州前一天 23 点，前一天已经跑过就跳过（20 点以后触发的都不跑，留给 0 点那次）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "加州现在 $(TZ=America/Los_Angeles date '+%F %H:%M')"
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          hour=$(TZ=America/Los_Angeles date +%-H)
          if [ "$hour" -ge 20 ]; then echo "加州 ${hour} 点，留给 0 点那次"; echo "run=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          since=$(date -u -d "@$(TZ=America/Los_Angeles date -d 00:00 +%s)" +%FT%TZ)
          done=0
          for id in $(gh api "repos/${{ github.repository }}/actions/workflows/alerts-nightly.yml/runs?event=schedule&created=>=${since}&per_page=20"                         --jq ".workflow_runs[] | select(.id != ${{ github.run_id }}) | .id"); do
            ran=$(gh api "repos/${{ github.repository }}/actions/runs/${id}/jobs" --jq '[.jobs[] | select(.name | startswith("Fetch NPS alerts")) | select(.conclusion == "success" or .status != "completed")] | length')
            if [ "${ran:-0}" -gt 0 ]; then done=1; echo "今天已经跑过（run ${id}）"; fi
          done
          if [ "$done" = 1 ]; then echo "run=false" >> "$GITHUB_OUTPUT"; else echo "run=true" >> "$GITHUB_OUTPUT"; fi

  alerts:
    name: Fetch NPS alerts, report new closures
    needs: when
    if: needs.when.outputs.run == 'true'
    runs-on: ubuntu-latest
    env:
      # 快照日期、issue 标题的日期都按加州的日子
      TZ: America/Los_Angeles
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci || npm install --no-audit --no-fund
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch alerts snapshot
        env:
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
        run: npm run alerts:fetch
      # 读过的公告（按 id + 更新时间 + 提示词版本）：每晚接着上一晚的用，只把新的、改过的交给模型
      - uses: actions/cache@v4
        with:
          path: copilot/data/alerts/extracted.json
          key: alerts-extracted-${{ github.run_id }}
          restore-keys: alerts-extracted-
      - name: Read alerts with the model (only new or changed ones)
        id: extract
        continue-on-error: true
        # 模型按 providers.alerts_chain 的顺序：Gemini → Nemotron 3.5 Super（OpenRouter 免费，推理开 high）→ Qwen（Groq）
        # → DeepSeek Flash（付费备用，免费的都出错才用），前一个出错（额度用完、服务忙）换下一个；一把 key 都没有就只用规则（CI 上没有本机模型）。
        # 每周的抽查（下一步）不给 DeepSeek 的 key：抽查只看免费模型，不花钱
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY$GEMINI_API_KEY$GROQ_API_KEY$DEEPSEEK_API_KEY" ]; then export COPILOT_ALERTS_PROVIDER=rules; fi
          cd copilot && python -m nps_copilot alerts --snapshot data/alerts/latest.json | tee ../extract.log
      - name: Check the model on 26 labelled alerts (canary)
        id: canary
        # 不能直接写 vars.ALERTS_CANARY != '0'：变量没设时是空字符串，GitHub 比较时把 '' 和 '0' 都转成数字 0，
        # 结果一直是“关掉”（10-20 到 10-26 一次都没跑过）。拼上一个字母再比，就按字符串比
        if: steps.extract.outcome == 'success' && format('x{0}', vars.ALERTS_CANARY) != 'x0'
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY$GEMINI_API_KEY$GROQ_API_KEY" ]; then echo "没有模型的 key，不抽查"; exit 0; fi
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date +%u)" != "1" ]; then echo "抽查每周一跑（今天是星期 $(date +%u)）"; exit 0; fi
          cd copilot && python eval/alerts.py --chain --sample 26 --gate eval/baseline-alerts-canary.json 2>&1 | tee ../canary.log
          exit "${PIPESTATUS[0]}"
      - name: Report a quality drop
        if: steps.canary.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create alerts-quality --color 6b4f3a --description "每晚抽查读公告的模型，分数掉到门槛以下" 2>/dev/null || true
          {
            echo "每晚抽查读公告的模型（\`eval/alerts.py --chain --sample 26\`，门槛 \`copilot/eval/baseline-alerts-canary.json\`）没过。"
            echo "可能是模型换了（前一家额度用完换到下一家）、NPS 改了公告写法，或者提示词要改。先看下面的分数和读错的几条。"
            echo
            echo '```'
            tail -n 25 canary.log
            echo '```'
          } > canary.md
          open=$(gh issue list --label alerts-quality --state open --json number --jq '.[0].number')
          if [ -n "$open" ]; then gh issue comment "$open" --body-file canary.md
          else gh issue create --label alerts-quality --title "读公告的模型分数掉了（$(date +%F)）/ Alert extraction quality dropped" --body-file canary.md; fi
      - uses: actions/upload-artifact@v4
        with:
          name: nps-alerts-snapshot
          path: |
            copilot/data/alerts/latest.json
            copilot/data/alerts/closures-latest.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Find closure alerts not reported before
        id: report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create nps-alerts --color a04c2e --description "每晚读 NPS 公告发现的新关闭" 2>/dev/null || true
          gh issue list --label nps-alerts --state all --limit 500 --json body --jq '.[].body' > known.txt
          # 一直开着的那个 issue：报过的公告 id 写在每晚的评论里，也要算进“报过了”
          rolling=$(gh issue list --label nps-alerts --state open --limit 50 --json number,body --jq '[.[] | select(.body | contains("<!-- nps-alerts-rolling -->"))][0].number // empty')
          echo "ROLLING=${rolling}" >> "$GITHUB_OUTPUT"
          if [ -n "$rolling" ]; then gh api --paginate "repos/${{ github.repository }}/issues/${rolling}/comments" --jq '.[].body' >> known.txt; fi
          python copilot/scripts/alerts_report.py copilot/data/alerts/latest.json --known known.txt --closures copilot/data/alerts/closures-latest.json --cache copilot/data/alerts/extracted.json --out report.md | tee report.log
          grep -m1 '^NEW=' report.log >> "$GITHUB_OUTPUT"
      - name: Propose changes to closures.ts
        id: propose
        if: hashFiles('copilot/data/alerts/closures-latest.json') != ''
        env:
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
        run: |
          npm run --silent check:closures > check.json || true
          node -e "JSON.parse(require('fs').readFileSync('check.json','utf8'))" 2>/dev/null || echo '{}' > check.json
          # --all：今天还有效、数据里还没有的都提议一遍（不看以前报没报过），分支每晚覆盖
          npm run --silent alerts:propose -- copilot/data/alerts/closures-latest.json --all --check check.json --out proposal.md | tee propose.log
          grep -m1 '^CHANGES=' propose.log >> "$GITHUB_OUTPUT"
      - name: Push the proposal to the bot/closures branch
        id: branch
        if: steps.propose.outputs.CHANGES != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${{ steps.propose.outputs.CHANGES }}" = "0" ]; then
            # 没有要改的：昨晚的分支也删掉，免得有人照着过期的提议合并
            git push origin --delete bot/closures 2>/dev/null || true
            exit 0
          fi
          git switch -c bot/closures
          git add src/data/closures.ts src/i18n/en/content/conditions.ts
          git commit -m "每晚读公告提议的临时关闭（$(date +%F)）/ Closures proposed from tonight's NPS alerts"
          git push --force origin bot/closures
          echo "url=https://github.com/${{ github.repository }}/compare/main...bot/closures?expand=1" >> "$GITHUB_OUTPUT"
      - name: Update the rolling issue
        if: steps.report.outputs.NEW != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "<!-- nps-alerts-rolling -->"
            echo "每晚读 NPS 公告自动更新（最后更新 $(date +%F)，加州时间）。新出现的关闭公告记在下面的评论里；这里只放**现在**还要不要改 \`src/data/closures.ts\`。"
            echo "每周集中处理一次：看过公告原文、改好中文说明和替代办法，合成一个 PR；处理完这个 issue 不用关，下一晚接着更新。"
            echo "Updated nightly from NPS alerts. New closure alerts are listed in the comments below; this body only shows what should change in \`src/data/closures.ts\` right now. Reviewed and merged once a week."
            echo
            if [ -f proposal.md ]; then cat proposal.md; else echo "今晚没有提议（没读到关闭清单）。"; fi
            if [ -n "${{ steps.branch.outputs.url }}" ]; then echo; echo "**提议已经写在 \`bot/closures\` 分支里（每晚覆盖）：${{ steps.branch.outputs.url }}**"; fi
          } > body.md
          rolling="${{ steps.report.outputs.ROLLING }}"
          if [ -z "$rolling" ]; then
            gh issue create --label nps-alerts --title "NPS 公告：新的关闭和要改的数据（每晚更新）/ NPS closure alerts (updated nightly)" --body-file body.md > created.txt
            rolling=$(grep -o '[0-9]*$' created.txt)
          else
            gh issue edit "$rolling" --body-file body.md
          fi
          if [ "${{ steps.report.outputs.NEW }}" != "0" ]; then
            gh issue comment "$rolling" --body-file report.md
          fi
      - name: Publish tonight's closures for the website
        if: hashFiles('copilot/data/alerts/closures-latest.json') != ''
        run: |
          cp copilot/data/alerts/closures-latest.json "$RUNNER_TEMP/closures-latest.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth 1 origin data/alerts-live:refs/remotes/origin/data/alerts-live 2>/dev/null; then
            git worktree add --detach "$RUNNER_TEMP/live" origin/data/alerts-live
            cd "$RUNNER_TEMP/live"
          else
            git worktree add --detach "$RUNNER_TEMP/live"
            cd "$RUNNER_TEMP/live"
            git checkout --orphan data-live
            git rm -rf -q .
            echo "每晚模型读 NPS 公告提取的关闭清单（.github/workflows/alerts-nightly.yml 写的，不要手改）。网站行程页按它排两周内出发的行程；usage.json 是每晚调用模型的计费总账，后台看。" > README.md
          fi
          cp "$RUNNER_TEMP/closures-latest.json" closures-latest.json
          # 这个分支只放数据，不让 Vercel 拿它构建预览版（Vercel 读的是这个分支自己的 vercel.json；bot/closures-* 的在 main 的 vercel.json 里）
          echo '{"git":{"deploymentEnabled":false}}' > vercel.json
          # 计费总账：今晚这台机器调用模型的次数、token 和花费并进 usage.json（后台看免费档用了多少）
          python "$GITHUB_WORKSPACE/copilot/scripts/publish_usage.py" usage.json
          git add -A
          if git diff --cached --quiet; then echo "和昨晚一样，不用推"; exit 0; fi
          git commit -q -m "关闭清单 $(date +%F) / Closures from NPS alerts"
          git push origin HEAD:refs/heads/data/alerts-live
